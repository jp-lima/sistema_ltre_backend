[project]
name = "ltre-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jota", email = "jpbrasil763@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.9.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.15.0",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
    "dotenv>=0.9.9",
    "psycopg>=3.3.6",
]

[project.scripts]
ltre-backend = "ltre_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
